[metadata]
name = climweb-dataset-helper
version = 0.1.0
description = Wizards to easily ingest reference datasets into WMO ClimWeb.
long_description = file:README.md
long_description_content_type = text/markdown
url = https://github.com/wmo-raf/climweb-dataset-helper
author = FGG Consultant
author_email =
license = MIT
classifiers =
    Development Status :: 4 - Beta
    Environment :: Web Environment
    Framework :: Django
    Framework :: Wagtail
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: Implementation :: CPython
    Topic :: Scientific/Engineering :: GIS
    Topic :: Software Development :: Libraries :: Application Frameworks

[options]
packages = find:
include_package_data = true
python_requires = >=3.8
install_requires =
    django>=4.2
    wagtail>=6.0
    geomanager>=0.6.0
    django-countries>=7.5

[options.packages.find]
exclude =
    sandbox
    sandbox.*

[options.extras_require]
# Admin Boundaries tab (OCHA / HDX COD-AB). Both are imported lazily and the app
# degrades with a clear error when absent, so they are not hard requirements.
# ClimWeb already ships both.
boundaries =
    geopandas>=1.0
    adm-boundary-manager>=0.3.0
